<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wudu Flow</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  background:#06150b;
}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%,#65ff78 0,transparent 25%),
    radial-gradient(circle at 90% 20%,#12a64d 0,transparent 30%),
    radial-gradient(circle at 50% 100%,#168b3b 0,transparent 35%),
    #06150b;
}

/* slime background */
.slime{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(8px);
  opacity:.45;
  animation:float 8s ease-in-out infinite alternate;
}

.b1{
  width:280px;height:280px;
  background:#75ff7c;
  left:-100px;top:-80px;
}
.b2{
  width:350px;height:350px;
  background:#08b84b;
  right:-150px;top:100px;
  animation-delay:1s;
}
.b3{
  width:240px;height:240px;
  background:#39e867;
  left:25%;bottom:-120px;
  animation-delay:2s;
}

@keyframes float{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(35px,25px) scale(1.15)}
}

.container{
  position:relative;
  z-index:2;
  width:min(94%,440px);
  margin:auto;
  padding:30px 0 40px;
}

.card{
  padding:22px;
  border-radius:30px;
  background:rgba(7,24,13,.91);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
  text-align:center;
}

.icon{font-size:55px}

h1{
  margin:4px 0;
  font-size:29px;
}

.subtitle{
  color:#a9bea9;
  font-size:14px;
}

.status{
  margin:20px 0 16px;
  padding:20px 10px;
  border-radius:22px;
  background:rgba(255,255,255,.055);
}

.statusIcon{
  font-size:55px;
}

.statusText{
  font-size:23px;
  font-weight:900;
  margin-top:5px;
}

.last{
  min-height:18px;
  margin-top:7px;
  font-size:11px;
  color:#91a494;
}

#toggle{
  width:100%;
  height:70px;
  border:0;
  border-radius:19px;
  background:#ed4e58;
  color:white;
  font-size:18px;
  font-weight:900;
  box-shadow:0 6px 0 #9b3038;
  cursor:pointer;
  touch-action:manipulation;
}

#toggle.yes{
  background:#72ed61;
  color:#082108;
  box-shadow:0 6px 0 #348d2b;
}

#toggle:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #9b3038;
}

#toggle.yes:active{
  box-shadow:0 1px 0 #348d2b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.stat{
  padding:10px 3px;
  border-radius:15px;
  background:rgba(255,255,255,.055);
  color:#91a196;
  font-size:10px;
  font-weight:800;
}

.num{
  display:block;
  color:white;
  font-size:22px;
  margin-top:3px;
}

.history{
  margin-top:14px;
  padding:13px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  text-align:left;
}

.historyTitle{
  text-align:center;
  font-weight:900;
  margin-bottom:7px;
}

#history{
  max-height:150px;
  overflow:auto;
}

.entry{
  padding:8px 2px;
  border-bottom:1px solid rgba(255,255,255,.07);
  font-size:12px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:11px;
}

.action,.reset{
  height:48px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:#292e2b;
  color:white;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation;
}

.reset{
  width:100%;
  margin-top:8px;
  background:#171c19;
  color:#aaa;
}

#toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:20px;
  transform:translate(-50%,30px);
  opacity:0;
  background:#101512;
  color:white;
  padding:11px 16px;
  border-radius:13px;
  font-size:13px;
  font-weight:800;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="slime">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="container">
  <div class="card">

    <div class="icon">🕌</div>

    <h1>Do You Have Wudu?</h1>
    <div class="subtitle">Wudu Flow 💧</div>

    <div class="status">
      <div class="statusIcon" id="statusIcon">❌</div>
      <div class="statusText" id="statusText">
        No wudu right now
      </div>
      <div class="last" id="last">
        No confirmation yet.
      </div>
    </div>

    <button id="toggle">
      NO — I DON'T ❌
    </button>

    <div class="stats">
      <div class="stat">
        CONFIRMED
        <span class="num" id="total">0</span>
      </div>

      <div class="stat">
        TODAY
        <span class="num" id="today">0</span>
      </div>

      <div class="stat">
        STATUS
        <span class="num" id="mini">NO</span>
      </div>
    </div>

    <div class="history">
      <div class="historyTitle">
        Confirmation History 💧
      </div>

      <div id="history">
        No confirmations yet.
      </div>
    </div>

    <div class="actions">
      <button class="action" id="set">
        💧 Set Wudu
      </button>

      <button class="action" id="clear">
        🗑️ Clear History
      </button>
    </div>

    <button class="reset" id="reset">
      🔄 Reset to No Wudu
    </button>

  </div>
</div>

<div id="toast"></div>

<script>

let state={
  wudu:false,
  records:[]
};

const KEY="wudu_flow_save";

function load(){

  try{

    const saved=localStorage.getItem(KEY);

    if(saved){

      const data=JSON.parse(saved);

      if(data){

        state.wudu=data.wudu===true;

        state.records=
          Array.isArray(data.records)
          ?data.records
          :[];

      }

    }

  }catch(e){}

}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

  }catch(e){}

}

function toast(message){

  const box=document.getElementById("toast");

  box.textContent=message;

  box.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    box.classList.remove("show");
  },1400);

}

function update(){

  const icon=
    document.getElementById("statusIcon");

  const text=
    document.getElementById("statusText");

  const button=
    document.getElementById("toggle");

  const mini=
    document.getElementById("mini");

  if(state.wudu){

    icon.textContent="✅";

    text.textContent=
      "You have wudu";

    mini.textContent="YES";

    button.textContent=
      "YES — I HAVE WUDU ✅";

    button.className="yes";

  }else{

    icon.textContent="❌";

    text.textContent=
      "No wudu right now";

    mini.textContent="NO";

    button.textContent=
      "NO — I DON'T ❌";

    button.className="";

  }

  document.getElementById("total")
    .textContent=state.records.length;

  const now=new Date();

  let today=0;

  state.records.forEach(time=>{

    const date=new Date(time);

    if(
      date.getFullYear()===now.getFullYear() &&
      date.getMonth()===now.getMonth() &&
      date.getDate()===now.getDate()
    ){
      today++;
    }

  });

  document.getElementById("today")
    .textContent=today;

  if(state.records.length){

    document.getElementById("last")
      .textContent=
      "Last confirmed: "+
      new Date(
        state.records[state.records.length-1]
      ).toLocaleString();

  }else{

    document.getElementById("last")
      .textContent=
      "No confirmation yet.";

  }

  const history=
    document.getElementById("history");

  history.innerHTML="";

  if(!state.records.length){

    history.textContent=
      "No confirmations yet.";

  }else{

    state.records
      .slice()
      .reverse()
      .slice(0,20)
      .forEach(time=>{

        const row=
          document.createElement("div");

        row.className="entry";

        row.textContent=
          "✅ Wudu confirmed — "+
          new Date(time).toLocaleString();

        history.appendChild(row);

      });

  }

}

function toggleWudu(){

  state.wudu=!state.wudu;

  if(state.wudu){

    state.records.push(
      new Date().toISOString()
    );

    toast("Wudu saved 💧");

  }else{

    toast("Changed to NO WUDU ❌");

  }

  save();

  update();

}

function setWudu(){

  if(state.wudu){

    toast("Already have Wudu ✅");

    return;

  }

  state.wudu=true;

  state.records.push(
    new Date().toISOString()
  );

  save();

  update();

  toast("Wudu confirmed 💧");

}

function clearHistory(){

  state.records=[];

  save();

  update();

  toast("History cleared");

}

function resetWudu(){

  state.wudu=false;

  save();

  update();

  toast("Reset to NO WUDU");

}

document
  .getElementById("toggle")
  .addEventListener(
    "click",
    toggleWudu
  );

document
  .getElementById("set")
  .addEventListener(
    "click",
    setWudu
  );

document
  .getElementById("clear")
  .addEventListener(
    "click",
    clearHistory
  );

document
  .getElementById("reset")
  .addEventListener(
    "click",
    resetWudu
  );

load();

update();

</script>

</body>
</html>
